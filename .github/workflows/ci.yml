name: CI

on:
  push:
    # Milestone branches run CI on every push, so a failure is found before a
    # pull request exists rather than after. `main` is listed separately
    # because it does not match the milestone pattern, and the `*/` form
    # catches a milestone branch created under a prefix.
    branches: [main, "m[0-9]*-**", "*/m[0-9]*-**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Platform-neutral checks run once and gate the slower native matrix.
  frontend:
    name: Frontend, contracts, and shared schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # xtask emits the contract schema, so the contract check needs Rust.
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Contract artifacts are current
        run: pnpm contracts:check
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm typecheck
      - run: pnpm test:ts
      - run: pnpm --filter @tramontana/desktop build:ui

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-2025
          # Named explicitly: "Linux" without a base image is not reproducible
          # (docs/DEVELOPMENT.md §5).
          - os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner image ships third-party apt sources this build does not
          # use. One of them (Chrome) served a `Packages.gz` whose hash did not
          # match its own index, and `apt-get update` treats any repository
          # failure as fatal — so a CDN hiccup at Google failed a run that had
          # nothing to do with Chrome.
          #
          # Matched by content rather than by filename: an earlier attempt
          # removed `google-chrome.list`, which is not what this image calls
          # it, so the fix silently did nothing and the run failed the same
          # way. Only `sources.list.d` is searched — on some images the Ubuntu
          # archive itself lives there, but never under these hostnames.
          #
          # Removing the sources is deliberate rather than making update
          # non-fatal, which would also hide a real failure of a repository
          # this build does depend on.
          for source in $(grep -rIl -e 'dl\.google\.com' -e 'packages\.microsoft\.com' \
                          /etc/apt/sources.list.d/ 2>/dev/null); do
            echo "removing unused third-party apt source: $source"
            sudo rm -f "$source"
          done
          echo "remaining apt sources:"
          ls -1 /etc/apt/sources.list.d/ 2>/dev/null || echo "  (none)"
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            gnome-keyring \
            dbus-x11 \
            libsecret-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      # tauri-build reads the frontend dist directory during codegen.
      - run: pnpm --filter @tramontana/desktop build:ui

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # What the binaries redistribute, from the lockfiles. Run on every
      # platform so the generated file is shown to be the same on each.
      - name: Third-party notices
        run: pnpm notices:check
      # The credential-store adapter is only meaningfully tested against a real
      # store, and a runner has no desktop session to provide one. Each
      # platform gets one here so the contract suite runs against the actual
      # Keychain, Credential Manager, and Secret Service rather than only
      # against the in-memory fake.
      #
      # `TRAMONTANA_REQUIRE_PLATFORM_SECRETS` turns "no store on this runner"
      # from a silent skip into a failure. Without it a broken keyring setup
      # would look exactly like a green run.
      - name: Provide a credential store (macOS)
        if: runner.os == 'macOS'
        run: |
          # A dedicated keychain rather than the runner's login keychain, which
          # may be locked and is not ours to write to. It is made the default
          # so `SecItemAdd` with no keychain specified lands in it.
          security create-keychain -p "" tramontana-ci.keychain
          security set-keychain-settings tramontana-ci.keychain
          security unlock-keychain -p "" tramontana-ci.keychain
          security default-keychain -s tramontana-ci.keychain
          security list-keychains -d user -s tramontana-ci.keychain login.keychain-db

      - name: Test
        if: runner.os != 'Linux'
        env:
          TRAMONTANA_REQUIRE_PLATFORM_SECRETS: "1"
        run: cargo test --workspace

      # Linux needs both halves: a session bus, and a Secret Service provider
      # on it that will actually accept a credential.
      #
      # The unlock password must be **non-empty**. With an empty one
      # `gnome-keyring-daemon` cannot create the login keyring on its own; it
      # tries to raise a GUI prompt, which fails with "cannot open display",
      # and every write is refused while reads still answer. Reproduced in an
      # `ubuntu:24.04` container: empty password fails, non-empty succeeds,
      # and pre-creating the keyring directory makes no difference either way.
      #
      # `--replace` keeps a second run from colliding with a daemon the image
      # already started.
      - name: Test (with a Secret Service on a session bus)
        if: runner.os == 'Linux'
        env:
          TRAMONTANA_REQUIRE_PLATFORM_SECRETS: "1"
        run: |
          dbus-run-session -- bash -c '
            # Two steps, because the second must not race the first.
            # `--daemonize --login` returns only once the login keyring exists
            # and is unlocked, so by the time `--start` brings up the secrets
            # component there is a collection to write to. Backgrounding a
            # single `--unlock` instead leaves the probe below racing the
            # daemon: it measured the same in the end, but only by observation
            # rather than by construction.
            eval "$(printf "tramontana-ci\n" | \
              gnome-keyring-daemon --daemonize --login 2>/dev/null)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            eval "$(gnome-keyring-daemon --start --components=secrets 2>/dev/null)"

            # Wait for a real credential to be storable, not for the bus name
            # to be owned. The name is owned well before a collection exists,
            # so the earlier version of this check went green against a store
            # that refused every write — and the failure surfaced as an
            # assertion inside a Rust test instead of here, where it belongs.
            ready=no
            for _ in $(seq 1 50); do
              if printf %s probe | secret-tool store --label=ci-probe \
                   tramontana ci-readiness 2>/dev/null; then
                secret-tool clear tramontana ci-readiness 2>/dev/null || true
                ready=yes
                break
              fi
              sleep 0.2
            done
            if [ "$ready" != yes ]; then
              echo "::error::the Secret Service never accepted a credential"
              exit 1
            fi
            echo "Secret Service accepted and removed a probe credential"

            cargo test --workspace
          '

      - name: CLI runs
        run: cargo run --quiet -p tramontana-cli -- info

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    # `rustsec/audit-check` reports through the Checks API, which a read-only
    # default token cannot write to — the audit itself succeeded and only the
    # reporting failed. Granting it here rather than widening the repository
    # default keeps every other job read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high
