[package]
name = "tramontana-desktop"
description = "Tauri shell and composition root for the Tramontana desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# A library target so the desktop entry point stays a thin wrapper around
# `run()`.
#
# Deliberately `rlib` only. The `staticlib` and `cdylib` types Tauri scaffolds
# are for mobile, which Phase 1 excludes (`ROADMAP.md`). If mobile ever comes
# into scope, they come back with it.
[lib]
name = "tramontana_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tramontana-core = { workspace = true }
tramontana-composition = { workspace = true }
tramontana-adapters-mcp = { workspace = true }
tramontana-adapters-tools = { workspace = true }
tramontana-persistence = { workspace = true }
tramontana-platform = { workspace = true }
tramontana-adapters-documents = { workspace = true }
tramontana-adapters-local = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Paused time, so a five-minute approval timeout is tested in no time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
