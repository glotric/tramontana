[package]
name = "tramontana-desktop"
description = "Tauri shell and composition root for the Tramontana desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The Tauri CLI expects a library target so the desktop entry point stays a
# thin wrapper and mobile targets remain possible later.
[lib]
name = "tramontana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tramontana-core = { workspace = true }
tauri = { version = "2.11.5", features = [] }
serde = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
