[package]
name = "tramontana-cli"
description = "Headless development and recovery adapter over the Tramontana application services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tramontana"
path = "src/main.rs"

[dependencies]
tramontana-core = { workspace = true }
tramontana-composition = { workspace = true }
tramontana-adapters-tools = { workspace = true }
tramontana-persistence = { workspace = true }
tramontana-platform = { workspace = true }
tramontana-adapters-documents = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = { workspace = true }

# Discarding typeahead before an approval prompt, so a line typed earlier is
# not read as the answer. `rustix` rather than `libc` for the reason given in
# `crates/adapters-local`: the workspace forbids `unsafe_code`, and this is a
# safe wrapper already in the dependency graph. Unix only; Windows is not
# handled yet.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios"] }

# A pseudo-terminal, so the approval tests read from a real terminal.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["termios", "pty"] }

[lints]
workspace = true
