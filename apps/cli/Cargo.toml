[package]
name = "tramontana-cli"
description = "Headless development and recovery adapter over the Tramontana application services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tramontana"
path = "src/main.rs"

[dependencies]
tramontana-core = { workspace = true }
tramontana-composition = { workspace = true }
tramontana-adapters-tools = { workspace = true }
tramontana-persistence = { workspace = true }
tramontana-platform = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
