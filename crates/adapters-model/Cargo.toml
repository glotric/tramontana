[package]
name = "tramontana-adapters-model"
description = "Model provider adapters. Talks HTTP; owns no domain rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tramontana-core = { workspace = true }
async-trait = { workspace = true }
# HTTP without TLS, deliberately: see `docs/decisions/0007-http-client-and-tls.md`.
# The endpoints this milestone targets are on loopback. Adding a TLS stack for
# a capability nothing uses yet cost a C crypto library on the build path and a
# transitive advisory; the decision moves to the milestone that needs it.
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
