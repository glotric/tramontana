[package]
name = "tramontana-composition"
description = "Turns configured endpoints into live providers and assembles the application service. The only place that knows every adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tramontana-core = { workspace = true }
tramontana-adapters-model = { workspace = true }
tramontana-adapters-local = { workspace = true }
tramontana-adapters-mcp = { workspace = true }
tramontana-adapters-browser = { workspace = true }
# The service plane (plane.rs): tools, persistence, documents and platform,
# assembled once for the desktop and a host.
tramontana-adapters-tools = { workspace = true }
tramontana-adapters-documents = { workspace = true }
tramontana-persistence = { workspace = true }
tramontana-platform = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[lints]
workspace = true
