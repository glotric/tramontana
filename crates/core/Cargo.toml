[package]
name = "tramontana-core"
description = "Provider-neutral domain types, ports, and application services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util", "net"] }
# SP0-A spike only (docs/SHARED_PROJECTS_PLAN.md): a task's events over a real
# WebSocket on loopback. The versions the browser adapter already carries.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true
