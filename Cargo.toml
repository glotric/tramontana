[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/adapters-tools",
    "crates/adapters-model",
    "crates/adapters-local",
    "crates/adapters-mcp",
    "crates/composition",
    "crates/persistence",
    "crates/platform",
    "apps/cli",
    "apps/desktop/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Tramontana contributors"]
repository = "https://github.com/glotric/tramontana"

# Single source of truth for third-party versions. Member crates depend on
# these with `workspace = true`, so no adapter can quietly pin its own copy of
# something the core also uses.
[workspace.dependencies]
tramontana-core = { path = "crates/core" }
tramontana-adapters-tools = { path = "crates/adapters-tools" }
tramontana-adapters-model = { path = "crates/adapters-model" }
tramontana-adapters-local = { path = "crates/adapters-local" }
tramontana-adapters-mcp = { path = "crates/adapters-mcp" }
tramontana-composition = { path = "crates/composition" }
tramontana-persistence = { path = "crates/persistence" }
tramontana-platform = { path = "crates/platform" }

anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
# Owning a command's whole process tree — a process group on Unix, a job object
# on Windows — without `unsafe` in this workspace (ADR 0024).
process-wrap = { version = "10.0.0", default-features = false, features = [
    "tokio1",
    "process-group",
    "job-object",
    "kill-on-drop",
] }
# The official MCP SDK: the client side over plain streams, nothing else.
# Tramontana spawns and owns the server process itself, and bounds what it
# reads from it (ADR 0034). Pinned exactly: a protocol library's minor
# release can change what reaches the permission boundary.
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "transport-async-rw"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
same-file = "1.0.6"
sha2 = "0.11.0"
# `sqlite-bundled` compiles SQLite from source rather than linking whatever the
# host provides, so all three target platforms get the same engine and version.
# `macros` is needed only for `migrate!`; compile-time-checked queries are
# deliberately not used (ADR 0004).
sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "sqlite-bundled",
    "runtime-tokio",
    "migrate",
    "macros",
    "tls-none",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1.26.0", features = ["v4"] }
yaml-rust2 = "0.12.0"

tempfile = "3.27.0"

[workspace.lints.rust]
# Orchestration, permissions, and persistence stay memory-safe. A crate that
# genuinely needs FFI relaxes this deliberately and locally.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Fail-closed habits: no silent panics or truncation in policy code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Code that runs only while building — procedural macros and build scripts —
# is not stripped. `strip = true` reaches them too, and on macOS 27 Apple's
# `strip` leaves a proc-macro library its own loader then refuses ("mis-aligned
# LINKEDIT string pool"), so `sqlx`'s macros could not load and no release
# built. What ships is still stripped.
[profile.release.build-override]
strip = false
