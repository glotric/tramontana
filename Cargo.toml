[workspace]
resolver = "3"
members = ["crates/core", "apps/cli", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Tramontana contributors"]
repository = "https://github.com/glotric/tramontana"

# Single source of truth for third-party versions. Member crates depend on
# these with `workspace = true`, so no adapter can quietly pin its own copy of
# something the core also uses.
[workspace.dependencies]
tramontana-core = { path = "crates/core" }

anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"

[workspace.lints.rust]
# Orchestration, permissions, and persistence stay memory-safe. A crate that
# genuinely needs FFI relaxes this deliberately and locally.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Fail-closed habits: no silent panics or truncation in policy code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
